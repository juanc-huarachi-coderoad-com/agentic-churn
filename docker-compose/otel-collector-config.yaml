# Minimal OTel Collector config for User Story 3 (observability) — logs every
# received span to stdout via `docker compose logs otel-collector`. No external
# backend required; a real deployment can swap the `debug` exporter for a hosted
# one without any application-code change (FR-009..012 only require the app emit
# OTLP, not which backend eventually reads it).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
