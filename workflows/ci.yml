# workflows/ci.yml
#
# CI pipeline referenced throughout this documentation set
# (architecture/03-technology-stack.md, architecture/09-clean-architecture-and-patterns.md,
# decisions/02-repo-and-tooling.md, tests/strategy.md). Written as a GitHub
# Actions workflow; copy or symlink into .github/workflows/ci.yml in the
# actual repository to activate it — kept here, in the project's own
# workflows/ folder, so it stays versioned alongside the documentation that
# specifies what it must do.
#
# Every step below traces to a specific engineering acceptance criterion
# in base/Churn-Sentiment-Agent-Product-Specification.md §14.3.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install backend deps
        run: uv sync
        working-directory: backend
      - name: Lint (ruff)
        run: uv run ruff check .
        working-directory: backend
      - name: Type-check (mypy)
        run: uv run mypy app
        working-directory: backend
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Type-check frontend
        run: pnpm run typecheck
        working-directory: frontend

  layer-boundaries:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps (includes import-linter)
        run: uv sync
        working-directory: backend
      # Enforces the Dependency Rule from every .importlinter contract —
      # generalizes the old scoring-only check to every module's Domain and
      # Application rings at once. Contracts documented in
      # decisions/02-repo-and-tooling.md §CI enforcement of the layer boundary;
      # rationale in architecture/09-clean-architecture-and-patterns.md.
      - name: Check layer boundaries (import-linter)
        run: uv run lint-imports
        working-directory: .

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps
        run: uv sync
        working-directory: backend
      - name: Apply DDL (data-base/10-ddl-appendix.md, via Alembic)
        run: uv run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/postgres
      - name: Load seed data (data-base/11-seed-data.sql)
        run: psql "$DATABASE_URL" -f ../data-base/11-seed-data.sql
        env:
          DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/postgres
      # Decimal reconciliation + monotonicity (tests/strategy.md)
      - name: Unit + property-based tests
        run: uv run pytest tests/ -v
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/postgres

  golden-replay:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_test_password
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Install deps
        run: uv sync
        working-directory: backend
      # The single test category the spec treats as non-negotiable
      # (spec §16, Phase 4 checkpoint; tests/strategy.md §Golden-replay tests).
      # A failure here blocks merge — no override.
      - name: Run fixture through pipeline, snapshot, truncate, replay, diff
        run: uv run pytest tests/golden_replay/ -v --strict
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/postgres

  required-checks:
    runs-on: ubuntu-latest
    needs: [layer-boundaries, unit-tests, golden-replay]
    steps:
      - run: echo "All required checks passed."
