# T024: every job below fails (and so does the workflow run) the moment any step exits
# non-zero — no `continue-on-error: true` is set anywhere in this file, deliberately.
# Actually blocking a PR merge on these three jobs additionally requires marking them as
# required status checks in the repository's branch protection settings — a one-time
# GitHub repo configuration this YAML file cannot express on its own.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.9"

      - name: Backend — ruff (T022)
        working-directory: backend
        run: |
          uv sync --locked
          uv run ruff check .

      - name: Backend — import-linter Dependency Rule gate (T021)
        working-directory: backend
        run: uv run lint-imports --config ../.importlinter

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend — eslint (T023)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.9"

      - name: Backend — mypy (T022)
        working-directory: backend
        run: |
          uv sync --locked
          uv run mypy app

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Frontend — tsc --noEmit (T023)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_churn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.9.9"

      # golden-replay / decimal-reconciliation / monotonicity placeholders (T028) —
      # tests/strategy.md's harness scaffold; real content lands build-order Phase 4/5.
      # tests/unit/ is real from specs/002-dashboard-shell (auth) and specs/003-
      # ingestion-and-context (ledger/profile/collectors) onward — it needs seed data
      # (identity_map/client_profile_versions rows several tests depend on) and an
      # encryption key (REQ-M1-P4: the app fails to start without one), both set up
      # here relative to `backend/` — CLIENT_PROFILE_PATH also needs a repo-relative
      # override since the default in .env.example assumes Docker's /app-rooted mounts.
      - name: Backend — migrate, seed, then run the test harness
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_churn
          ENCRYPTION_KEY_PATH: ./secrets/data.key
          CLIENT_PROFILE_PATH: ../demo/client-profile.yaml
        run: |
          uv sync --locked
          mkdir -p secrets
          python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())" > secrets/data.key
          uv run alembic upgrade head
          uv run python scripts/seed.py
          uv run pytest tests/golden_replay/ tests/scoring/ tests/unit/ -v
