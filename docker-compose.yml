# One Compose stack per client deployment (architecture/03-technology-stack.md).
services:
  migrate:
    build: ./backend
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Read-only: data-base/11-seed-data.sql is documentation living outside the
      # image's build context (backend/), needed by scripts/seed.py (FR-003). Not baked
      # into the image so editing seed data doesn't require a rebuild.
      - ./data-base:/data-base:ro
      # Read-only: the Fernet key file for message-body encryption (specs/003-
      # ingestion-and-context, REQ-M1-P4) — never baked into the image, generated
      # once on the host per quickstart.md and mounted in.
      - ./secrets:/app/secrets:ro
      # Read-only: the collector fixture and the CS lead's hand-edited client profile
      # YAML — both live outside the image's build context so editing either doesn't
      # require a rebuild (specs/003-ingestion-and-context).
      - ./demo:/app/demo:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  worker:
    build: ./backend
    env_file: .env
    command: python -m app.worker
    volumes:
      - ./secrets:/app/secrets:ro
      - ./demo:/app/demo:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Overrides the image's inherited HTTP healthcheck (backend/Dockerfile targets
      # port 8000, which only the api service actually serves) — the worker has no HTTP
      # surface in this feature, so this is a plain interpreter-liveness check instead.
      test: ["CMD", "python", "-c", "exit(0)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  db:
    image: postgres:16
    env_file: .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  web:
    build: ./frontend
    env_file: .env
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  db_data:
    # This deployment's data only, on its own volume — never shared with any other
    # client's stack (constitution "Isolation model"). `docker compose down -v` is the
    # documented reprovision/wipe path (quickstart.md Troubleshooting).
