# One Compose stack per client deployment (architecture/03-technology-stack.md).
services:
  migrate:
    build: ./backend
    env_file: .env
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    env_file: .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Read-only: data-base/11-seed-data.sql is documentation living outside the
      # image's build context (backend/), needed by scripts/seed.py (FR-003). Not baked
      # into the image so editing seed data doesn't require a rebuild.
      - ./data-base:/data-base:ro
      # Read-only: the original single Fernet key file (specs/003-ingestion-and-
      # context, REQ-M1-P4) — kept only so any pre-migration "local-v1"-tagged row
      # can still be decrypted (specs/011-production-hardening data-model.md).
      - ./secrets:/app/secrets:ro
      # Read-write: daily key-rotation bucket files (specs/011-production-hardening,
      # research.md Decision 1) — the api process encrypts under today's bucket
      # whenever it re-ingests events (e.g. a profile-edit replay), so it needs
      # write access here, unlike the read-only single-key file above.
      - ./secrets/data-keys:/app/secrets/data-keys
      # Read-only: the collector fixture and the CS lead's hand-edited client profile
      # YAML — both live outside the image's build context so editing either doesn't
      # require a rebuild (specs/003-ingestion-and-context).
      - ./demo:/app/demo:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  worker:
    build: ./backend
    env_file: .env
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    command: python -m app.worker
    volumes:
      - ./secrets:/app/secrets:ro
      # Read-write: the retention job (User Story 1) is the only process that ever
      # destroys a bucket's key file, and the absence collector/score recompute jobs
      # running here may also be the first to create a new day's bucket key.
      - ./secrets/data-keys:/app/secrets/data-keys
      - ./demo:/app/demo:ro
      # Read-write: the scheduled backup job (specs/031-production-deployment-hardening-ii)
      # writes pg_dump output here and prunes files older than backup_retention_days — only
      # the worker runs scheduled jobs, matching every other job's own precedent above.
      - ./backups:/app/backups
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Overrides the image's inherited HTTP healthcheck (backend/Dockerfile targets
      # port 8000, which only the api service actually serves) — the worker has no HTTP
      # surface in this feature, so this is a plain interpreter-liveness check instead.
      test: ["CMD", "python", "-c", "exit(0)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker-compose/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  db:
    # specs/027-pgvector-embedding-store — a drop-in postgres:16 image with the
    # pgvector extension pre-installed (research.md Decision 5); the embedding_cache
    # migration's CREATE EXTENSION vector fails against a vanilla postgres:16 image.
    image: pgvector/pgvector:pg16
    env_file: .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 5

  web:
    build: ./frontend
    env_file: .env
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  db_data:
    # This deployment's data only, on its own volume — never shared with any other
    # client's stack (constitution "Isolation model"). `docker compose down -v` is the
    # documented reprovision/wipe path (quickstart.md Troubleshooting).
