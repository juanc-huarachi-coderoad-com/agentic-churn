[project]
name = "agentic-churn-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "anthropic>=0.40.0",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "cryptography>=44.0.0",
    "fastapi>=0.141.1",
    "hdbscan>=0.8.40",
    "langgraph>=1.2.11",
    "openai>=1.109.1",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "pyannoteai-sdk>=0.4.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.2",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.165.5",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.3",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# migrations/versions/ embeds data-base/10-ddl-appendix.md's DDL verbatim (module
# docstring, migrations/versions/0001_initial_schema.py) — reflowing those lines to fit
# line-length would break the "verbatim" guarantee, so generated/imported migration
# content is excluded from style linting the same way mypy already excludes it.
extend-exclude = ["migrations/versions/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# FastAPI's dependency-injection pattern requires Depends(...)/Query(...)/etc. as
# argument defaults — B008 exists to catch real mutable-default bugs, not this.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "hdbscan.*"
ignore_missing_imports = true

# specs/019-meeting-audio-ingestion — pyannoteai-sdk ships no inline types or
# py.typed marker (local storage discovery/reads use only pathlib — no override needed).
[[tool.mypy.overrides]]
module = "pyannoteai.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# app.db.engine is a module-level singleton (one asyncpg connection pool) — with
# pytest-asyncio's default function-scoped loop, each test gets a fresh event loop but
# reuses pooled connections opened under a *different, already-closed* loop, which
# asyncpg rejects ("another operation is in progress"). Session-scoped loop keeps one
# loop for the whole run, matching the engine's actual lifecycle.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
